syntax = "proto3";

package chromiumos.config.api;

import "src/config/api/component.proto";
import "src/config/api/design_id.proto";
import "src/config/api/design_variant_id.proto";
import "src/config/api/hardware_topology.proto";
import "src/config/api/partner_id.proto";
import "src/config/api/program_id.proto";

option go_package = "go.chromium.org/chromiumos/config/go/api";

message Design {
  // Globally unique design identifier.
  DesignId id = 1;
  // Program that defines the constraints for this design.
  ProgramId program_id = 2;
  // ODM for the given hardware design.
  PartnerId odm_id = 3;
  // Design codename (human friendly).
  string name = 4;

  // Supported variants for the given hardware design.
  repeated Variant variants = 6;

  // Defines a unique hardware configuration/setup for a given hardware design
  // and the corresponding features that will be supported for that variant.
  message Variant {
    // The ID encoded in hardware on a device, typically in CBI.
    DesignVariantId id = 1;

    // Each unique value of hardware_topology requires a unique DesignVariantId
    HardwareTopology hardware_topology = 2;

    // This field is generated from hardware_topology. Each Design repo can
    // convert HardwareTopology into the correct normalized HardwareFeature
    HardwareFeatures hardware_features = 3;

    // TODO, should this be moved into Design or Program? This isn't used here
    message Constraint {
      enum Level {
        TYPE_UNKNOWN = 0;
        REQUIRED = 1;
        PREFERRED = 2;
        OPTIONAL = 3;
      }

      Level level = 1;
      HardwareFeatures features = 2;
    }
  }
}

message DesignList {
  repeated Design value = 1;
}
