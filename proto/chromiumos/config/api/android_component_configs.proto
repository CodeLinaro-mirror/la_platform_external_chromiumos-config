// Wifi component configuration. Annotation to the fields:
// id: The identity field among the enumeration of possible variants on this HW
message WifiConfigurationType {
  string id = 1;
  enum WifiChip {
    UNKNOWN = 0;
    INTEL = 1;
    MTK = 2;
    RTW = 3;
    QCOM = 4;
  }
  WifiChip chip = 2;

  message SarSpecType {
    message PowerConfigType {
      int32 powerlimit = 1;
      int32 poweroffset = 2;
    }
    message RegDomainType {
      PowerConfigType powerconfig_2g = 1;
      PowerConfigType powerconfig_5g = 2;
      optional PowerConfigType powerconfig_6g = 3;
    }
    message PowerTableType {
      PowerConfigType powerconfig_2g = 1;
      optional PowerConfigType powerconfig_5g = 2;
      optional PowerConfigType powerconfig_5g_1 = 3;
      optional PowerConfigType powerconfig_5g_2 = 4;
      optional PowerConfigType powerconfig_5g_3 = 5;
      optional PowerConfigType powerconfig_5g_4 = 6;
      optional PowerConfigType powerconfig_6g_1 = 7;
      optional PowerConfigType powerconfig_6g_2 = 8;
      optional PowerConfigType powerconfig_6g_3 = 9;
      optional PowerConfigType powerconfig_6g_4 = 10;
      optional PowerConfigType powerconfig_6g_5 = 11;
      optional PowerConfigType powerconfig_6g_6 = 12;
    }
    optional RegDomainType regdomain_fcc = 1;
    optional RegDomainType regdomain_eu = 2;
    optional RegDomainType regdomain_other = 3;
    optional PowerTableType powertable_tablet = 4;
    optional PowerTableType powertable_clamshell = 5;
  }
  optional SarSpecType mtkconfig = 3;
  optional SarSpecType rtwconfig = 4;
  optional HalConfiguration.Present feature_aware = 5;
  optional HalConfiguration.Present feature_direct = 6;
  optional HalConfiguration.Present feature_passport = 7;
  optional HalConfiguration.Present feature_rtt = 8;
}

// ProximitySensor component configuration. Annotation to the fields:
// id: The identity field among the enumeration of possible variants on this HW
message ProximityConfigurationType {
  string id = 1;
  message LocationType {
    optional string modifier = 1;
  }
  message ProximityLocationType {
    optional LocationType radio_type_wifi = 1;
    optional LocationType radio_type_cellular = 2;
  }
  message SemtechChannelType {
    optional string channel = 1;
    optional uint32 hardwaregain = 2;
    optional uint32 thresh_falling = 3;
    optional uint32 thresh_falling_hysteresis = 4;
    optional uint32 thresh_rising = 5;
    optional uint32 thresh_rising_hysteresis = 6;
  }
  message SemtechSensorConfigurationType {
    repeated SemtechChannelType channel = 1;
    optional float sampling_frequency = 2;
    optional uint32 thresh_falling_period = 3;
    optional uint32 thresh_rising_period = 4;
  }
  message SemtechProximityConfigurationType {
    optional ProximityLocationType location = 1;
    optional SemtechSensorConfigurationType semtech_config = 2;
  }
  optional SemtechProximityConfigurationType semtech_proximity = 2;
}

message HalConfiguration {
  enum Present {
    PRESENT_UNKNOWN = 0;
    PRESENT = 1;
    NOT_PRESENT = 2;
  }

  repeated AudioConfigurationType audio_list = 1;
  repeated FingerprintConfigurationType fingerprint_list = 2;
  repeated CellularConfigurationType cellular_list = 3;
  repeated CameraConfigurationType camera_list = 4;
  repeated StorageConfigurationType storage_list = 5;
  repeated KeyboardConfigurationType keyboard_list = 6;
  repeated StylusConfigurationType stylus_list = 7;
  repeated FirmwareConfigurationType firmware_list = 8;
  repeated TouchscreenConfigurationType touchscreen_list = 9;
  repeated TouchpadConfigurationType touchpad_list = 10;
  repeated VideoConfigurationType video_list = 11;
  repeated HardwareFeatureConfigurationType hwfeature_list = 12;
  repeated GyroscopeConfigurationType gyroscope_list = 13;
  repeated AccelerometerConfigurationType accelerometer_list = 14;
  repeated LightSensorConfigurationType lightsensor_list = 15;
  repeated MagnetometerConfigurationType magnetometer_list = 16;
  repeated WifiConfigurationType wifi_list = 17;
  repeated ProximityConfigurationType proximity_list = 18;
}
