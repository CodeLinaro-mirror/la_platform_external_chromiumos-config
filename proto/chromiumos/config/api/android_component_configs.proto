syntax = "proto3";

package chromiumos.config.api;

option go_package = "go.chromium.org/chromiumos/config/go/api";

// Audio component configuration. Annotation to the fields:
// id: The identity field among the enumeration of possible variants on this HW
//   config component for all devices under the same project build. The enumer-
//   ration is generated by boxster config infra according to this project's
//   hw_mapping_table.txtpb file under its project code repo.
// soundcard: Internal sound card name.
message AudioConfigurationType {
  string id = 1;
  optional string soundcard = 2;
  optional int32 dmics_count = 3;
  optional string audio_config_dir = 4;
}

// Cellular component configuration. Annotation to the fields:
// id: The identity field among the enumeration of possible variants on this HW
//   config component for all devices under the same project build. The enumer-
//   ration is generated by boxster config infra according to this project's
//   hw_mapping_table.txtpb file under its project code repo.
// firmware_variant: The modem firmware file to flash onto the modem.
// modem_type: One of ModemTypeEn
message CellularConfigurationType {
  string id = 1;
  enum ModemType {
    MODEM_UNKNOWN = 0;
    MODEM_L850 = 1;
    MODEM_NL668 = 2;
    MODEM_FM101 = 3;
    MODEM_FM350 = 4;
    MODEM_SC7180 = 5;
    MODEM_SC7280 = 6;
    MODEM_EM060 = 7;
    MODEM_RW101 = 8;
    MODEM_RW135 = 9;
    MODEM_LCUK54 = 10;
    MODEM_RW350 = 11;
  }
  optional ModemType modem_type = 2;
  optional string firmware_variant = 3;
}

// Fingerprint component configuration. Annotation to the fields:
// id: The identity field among the enumeration of possible variants on this HW
//   config component for all devices under the same project build. The enumer-
//   ration is generated by boxster config infra according to this project's
//   hw_mapping_table.txtpb file under its project code repo.
// board: Specifies the fingerprint board in use.
// fingerprint_sensor_type: Type of FP sensor. Currently describes whether FP is
//   overlapped on the power button or not.
// ro_version: RO version for the fingerprint firmware for the FPMCU specified
//   by the "board" property. If not specified, the default RO version for the
//   FPMCU is used.
// sensor_location: Specifies the location of the fingerprint sensor.
message FingerprintConfigurationType {
  string id = 1;
  string board = 2;
  optional string fingerprint_sensor_type = 3;
  enum Location {
    LOCATION_UNKNOWN = 0;
    // Top of the screen (e.g. Pixel Slate) at the left
    POWER_BUTTON_TOP_LEFT = 1;
    // Bottom of keyboard at the left
    KEYBOARD_BOTTOM_LEFT = 2;
    // Bottom of keyboard at the right
    KEYBOARD_BOTTOM_RIGHT = 3;
    // Top of keyboard at the right (e.g. Galaxy Chromebook)
    KEYBOARD_TOP_RIGHT = 4;
    reserved 5;  // Not to conflict with NOT_PRESENT
    // At the right side
    RIGHT_SIDE = 6;
    // At the left side
    LEFT_SIDE = 7;
    reserved 8;  // Not to conflict with PRESENT
    // Left of power button at top right corner (of the keyboard)
    LEFT_OF_POWER_BUTTON_TOP_RIGHT = 9;
    // On power button at the top right key of the keyboard.
    POWER_BUTTON_TOP_RIGHT_KEY = 10;
    // On power button, on the left edge at the top (detachable device,
    // landscape orientation).
    POWER_BUTTON_LEFT_EDGE_TOP = 11;
  }
  optional Location sensor_location = 4;
  optional string ro_version = 5;
}

// Camera component configuration. Annotation to the fields:
// id: The identity field among the enumeration of possible variants on this HW
//   config component for all devices under the same project build. The enumer-
//   ration is generated by boxster config infra according to this project's
//   hw_mapping_table.txtpb file under its project code repo.
// media_profile_suffix: This is used to set ro.media.xml_variant.profiles,
//   which derives the media_profile.xml file for the given SKU.
message CameraConfigurationType {
  string id = 1;
  optional string media_profile_suffix = 2;
  enum Interface {
    INTERFACE_UNKNOWN = 0;
    INTERFACE_USB = 1;
    INTERFACE_MIPI = 2;
  }
  enum Facing {
    FACING_UNKNOWN = 0;
    FACING_FRONT = 1;
    FACING_BACK = 2;
  }
  message Resolution {
    int32 resolutionx = 1;
    int32 resolutiony = 2;
  }
  message CameraHWConfig {
    optional Interface interface = 1;
    optional Facing position = 2;
    optional HalConfiguration.Present autofocus_support = 3;
    reserved 4, 5;
    reserved "resolutionx", "resolutiony";
    optional HalConfiguration.Present p1080_support = 6;
    repeated Resolution resolutions = 7;
  }
  repeated CameraHWConfig cameras = 3;
}

