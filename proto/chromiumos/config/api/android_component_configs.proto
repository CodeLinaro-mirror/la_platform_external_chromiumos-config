// This protocol buffer is based off the autogenerated one, converted from
// device/google/desktop/common/config/hal_config.xsd, using Google3 python
// script xsd2proto.
//
// cmdline:
// blaze build //finance/scripts/xsd2proto:xsd2proto &&
// /google3/blaze-bin/finance/scripts/xsd2proto/xsd2proto
// --xsd_file=hal_config.xsd --output_file=hal_config.proto --emit_cdata=false
//
// Message definitions are added one by one.

syntax = "proto3";

package chromiumos.config.api;

option go_package = "go.chromium.org/chromiumos/config/go/api";

// Audio component configuration. Annotation to the fields:
// id: The identity field among the enumeration of possible variants on this HW
//   config component for all devices under the same project build. The enumer-
//   ration is generated by boxster config infra according to this project's
//   hw_mapping_table.txtpb file under its project code repo.
// soundcard: Internal sound card name.
message AudioConfigurationType {
  string id = 1;
  string soundcard = 2;
}

// Cellular component configuration. Annotation to the fields:
// id: The identity field among the enumeration of possible variants on this HW
//   config component for all devices under the same project build. The enumer-
//   ration is generated by boxster config infra according to this project's
//   hw_mapping_table.txtpb file under its project code repo.
// firmware_variant: The modem firmware file to flash onto the modem.
// modem_type: One of ModemTypeEn
message CellularConfigurationType {
  uint32 id = 1;
  string modem_type = 2;
  string firmware_variant = 3;
}

// Fingerprint component configuration. Annotation to the fields:
// id: The identity field among the enumeration of possible variants on this HW
//   config component for all devices under the same project build. The enumer-
//   ration is generated by boxster config infra according to this project's
//   hw_mapping_table.txtpb file under its project code repo.
// board: Specifies the fingerprint board in use.
// fingerprint_sensor_type: Type of FP sensor. Currently describes whether FP is
//   overlapped on the power button or not.
// ro_version: RO version for the fingerprint firmware for the FPMCU specified
//   by the "board" property. If not specified, the default RO version for the
//   FPMCU is used.
// sensor_location: Specifies the location of the fingerprint sensor.
message FingerprintConfigurationType {
  string id = 1;
  string board = 2;
  string fingerprint_sensor_type = 3;
  string sensor_location = 4;
  optional string ro_version = 5;
}

message HalConfiguration {
  repeated AudioConfigurationType audio_list = 1;
  repeated FingerprintConfigurationType fingerprint_list = 2;
  repeated CellularConfigurationType cellular_list = 3;
}
