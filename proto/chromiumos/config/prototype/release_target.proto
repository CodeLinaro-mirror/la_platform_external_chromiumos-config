syntax = "proto3";

package chromiumos.config.prototype;

option go_package = "go.chromium.org/chromiumos/config/go/prototype";

import "chromiumos/config/prototype/release_target_id.proto";
import "chromiumos/config/prototype/signing.proto";
import "chromiumos/build/api/system_image.proto";

// Defines a collection of build targets that are all part of the same logical
// release target and corresponding config tied to the release target.
// E.g. octopus -> octopus-kernel-debug, octopus-kernel_4_14, octopus
// Build targets will change over time with alternate builds, but the release
// target will remain stable over time.
message ReleaseTarget {

  ReleaseTargetId id = 1;

  // Human friendly name
  string name = 2;

  // Defines the primary build target for a given release.
  chromiumos.build.api.SystemImage.BuildTarget main_target = 5;

  // Defines the uprev build target for a given release.
  repeated chromiumos.build.api.SystemImage.BuildTarget varient_targets = 6;

  // Defines the signing instructions set for this release.
  SigningInstructions signing_instructions = 4;
}
