// Stable payload format provided by the build API to summarize build system
// information from a given build.  This is meant to be a format with long-term
// stability, so no backwards-incompatible changes if at all possible.

syntax = "proto3";

package chromiumos.build.payload;
option go_package = "go.chromium.org/chromiumos/config/go/build/payload";

import "chromiumos/build/api/portage.proto";

message BuildMetadata {
    // An escape hatch for long-term-support of the format.  If breaking or
    // incompatible changes are required, the version should be incremented so
    // we can more easily translate to ToT format.
    int32 version = 1;

    // Client-specific ID value set by upstream build API caller.
    string client_id = 2;

    // Information passed to portage as part of the build.
    api.Portage.BuildTarget build_target = 3;

    // Provides a summary of common key packages used in the build.
    message PackageSummary {
        Arc       arc       = 1;
        AshChrome chrome    = 2;
        Kernel    kernel    = 3;
    }

    // package-specific meta data for VIPs (very important packages).  Wrapped
    // in their own message to let us extend them in the future.

    message Kernel {
        string version = 1;
    }

    message Arc {
        string version = 1;
        string branch  = 2;
    }

    message AshChrome {
        string version = 1;
    }
}
