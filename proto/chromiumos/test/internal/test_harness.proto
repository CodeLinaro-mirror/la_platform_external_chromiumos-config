syntax = "proto3";

package chromiumos.test.internal;

option go_package = "go.chromium.org/chromiumos/config/go/test/internal";

// Defines a test execution framework that can execute test cases and report
// results.
message TestHarness {
  // Globally unique (for ChromeOS) identifier of a given test harness
  oneof test_harness_type {
    Manual manual = 1;
    Tauto tauto = 2;
    Tast tast = 3;
  }

  message Manual {}
  message Tast {}
  message Tauto {}
}
