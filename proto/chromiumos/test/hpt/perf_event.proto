syntax = "proto3";

package chromiumos.test.hpt;

option go_package = "go.chromium.org/chromiumos/config/go/test/hpt";

// PerfRecord is the metadata of perf event collected from the DUT.
message PerfRecord {
  // Bucket where perf data can be found in GCS.
  optional string bucket = 1;

  // object_path path to perf data in GCS
  optional string object_path = 2;

  // Branch of the ChromeOS on the DUT where the perf data was collected.
  // Example R117
  optional string branch = 3;

  // Version of the ChromeOS on the DUT where the perf data was collected.
  // Example 15572.8.0
  optional string version = 4;

  // Board of DUT where the perf data was collected.
  // Example brya
  optional string board = 5;
}
