syntax = "proto3";

package chromiumos.test.api;

option go_package = "go.chromium.org/chromiumos/config/go/test/api";

import "chromiumos/test/lab/api/dut.proto";
import "chromiumos/test/api/provision_state.proto";
import "chromiumos/test/api/provision_service.proto";

message ProvisionCliInput {
  repeated DutInput dut_inputs = 1;
}

message DutInput {
  chromiumos.test.lab.api.Dut.Id id = 1;
  // Docker tag uses to pull docker images for DutService and ProvisionService.
  string docker_tag = 2;
  // Provision state is pass through request to the provision service.
  ProvisionState provision_state = 3;
}

message ProvisionCliOutput {
  repeated DutOutput dut_outputs = 1;
}

message DutOutput {
  chromiumos.test.lab.api.Dut.Id id = 1;
  // Outcome represents the result of performing provisioning on the DUT.
  oneof outcome {
    InstallSuccess success = 2;
    InstallFailure failure = 3;
  }
}
