syntax = "proto3";

package chromiumos.test.api;

option go_package = "go.chromium.org/chromiumos/config/go/test/api";

import "chromiumos/test/api/test_case.proto";

// Defines a named collection of tests.
//
// For test scheduling/execution purposes, there is no guarantee on ordering.
// Tests can be batched/unbatched in different sequences and can be
// executed on different devices altogether.
message TestSuite {
  // Optional human friendly name
  string name = 1;

  oneof spec {
    // Explicit list of tests
    TestCaseIdList test_case_ids = 2;
    // Tests are included via tag inclusion/exclusion criteria.
    TestCaseTagCriteria test_case_tag_criteria = 3;
    // List of all test_cases
    TestCaseList test_cases = 4;
  }

  // Defines tag based selection criteria, which is applied against
  // a list of TestCase definitions to determine test suite inclusion.
  //
  // Tests are included if they meet the following:
  //  - MATCH ALL of the [include] tags.
  //  - DO NOT MATCH ANY of the exclude tags.
  //
  // Tags must match exactly (i.e. no regexp, wildcard, etc. allowed).
  message TestCaseTagCriteria {
    repeated string tags = 1;
    repeated string tag_excludes = 2;
  }
}
