syntax = "proto3";

package chromiumos.test.api;

option go_package = "go.chromium.org/chromiumos/config/go/test/api";

import "chromiumos/build/api/firmware_config.proto";
import "chromiumos/storage_path.proto";

// FirmwareProvisionStartupMetadata can be passed to
// ProvisionStartupRequest.metadata
message FirmwareProvisionStartupMetadata {
  reserved 1;
  reserved "cache_server_address";
}

// FirmwareProvisionInstallMetadata can be passed to InstallRequest.metadata
message FirmwareProvisionInstallMetadata {
  // Detailed Request allows you to specify individual versions of
  // AP_RW, AP_RO, EC_RO, and PD_RO.
  // Service will extract the images from firmware archive and install
  // them individually over futility.
  // ec_ro over Servo is flashed using flash_ec.
  //
  // FirmwareConfig is also used by boxter, so we probably shouldn't add anything to it.
  // Add new fields below instead.
  chromiumos.build.api.FirmwareConfig firmware_config = 1;

  enum OperatingSystem {
    UNKNOWN = 0;
    CHROMEOS = 1;
    ANDROID = 2;
  }

  // The expected operating system of the device.
  OperatingSystem os = 2;

  // Force updating the firmware even if it is already the right version.
  bool force_flash_same_version = 3;

  // PDC firmware. A map of cbfs filename to gs storage path.
  map<string, chromiumos.StoragePath> pdc_firmware_images = 4;
}

message PDCFirmwareVersion {
  string filename = 1;
  string version = 2;
}

// FirmwareProvisionResponse records the response of the firmware provisioning.
message FirmwareProvisionResponse {
  // If the provisioning failed, here is the detailed error message.
  // Deprecated: Use InstallResponse.message instead.
  string error_message = 1 [deprecated = true];
  // The firmware versions on the DUT (if success), or the versions that were
  // attempted to be flashed (if failed).
  string ap_ro_version = 2;
  string ap_rw_version = 3;
  string ec_ro_version = 4;
  string ec_rw_version = 5;

  // PDC firmware. A map of port to cbfs filename and version.
  map<int32, PDCFirmwareVersion> pdc_firmware_versions = 6;
}
