syntax = "proto3";

package chromiumos.test.api;

option go_package = "go.chromium.org/chromiumos/config/go/test/api";

import "chromiumos/build/api/dlc.proto";
import "chromiumos/build/api/firmware_config.proto";
import "chromiumos/build/api/portage.proto";
import "chromiumos/storage_path.proto";

// ProvisionState defines all of the installable (provisionable) elements on a
// ChromeOS test device as part of device setup for test operations.
//
// This record is used to define the following:
//   How devices should be provisioned based on the client's respective needs.
//     E.g.
//       CrOS CI - System image only
//       Lacros CI - System image + Lacros component
//   How device provisioning state is reported for corresponding test results.
//     Every test result will link to a provisioning record for
//     analysis/debugging.
message ProvisionState {
  // String encoded id that uniquely reflects a given ProvisionState.
  // This is used for both scheduling and reporting purposes.
  // For scheduling, is used to determine if a device is in the requested
  // provisioning state for testing or it needs to be reprovisioned.
  // For reporting, this can be used to compare the entire provision state
  // (in a summarized string) across different test results.
  message Id {
    string value = 1;
  }
  Id id = 1;

  chromiumos.build.api.FirmwareConfig firmware = 2;

  message SystemImage {
    // Unique version used in constructing the overall Id
    string version = 1;
    StoragePath system_image_path = 2;
    // List of DLCs that were built/archived for a given system image and are
    // installed as part of provisioning.
    repeated chromiumos.build.api.Dlc.Id dlcs = 3;

    // An optional tarball to be extracted at the root of the filesystem to
    // overwrite existing binary payloads.
    StoragePath overwrite_payload = 4;
  }
  SystemImage system_image = 3;

  message Package {
    // Package names must match actual portage package names that
    // exist in a given ChromeOS test image.
    // Package versions may be in any scheme that is relevant to the clients
    // versioning scheme (e.g. Lacros build versions).
    chromiumos.build.api.Portage.Package portage_package = 1;
    StoragePath package_path = 2;
  }
  repeated Package packages = 4;

  // Prevents device reboot during system image provisioning.
  bool prevent_reboot = 5;

  // update_firmware will update OS bundled firmware(RW only) during the provision.
  // Please note this firmware update only update RW firmware that built in the
  // target_build OS image and it is different from firmware provision which
  // download and update a separate firmware image based on request.
  bool update_firmware = 6;

  // Use force to pass "--force" to futility, which skips the TPM checks.
  bool firmware_force = 7;

  // If True, provision firmware over servo; information about
  // servo to use will be pulled from a `Dut` proto, that will be
  // requested from InventoryService.
  // If False, SSH to the DUT and provision it directly.
  bool use_servo = 8;
}

// User configurable provisioning settings.  These inform the final
// ProvisionState that's requested from the provisioning service.
message ProvisionConfig {
    chromiumos.build.api.FirmwareConfig  firmware = 1;
    repeated chromiumos.build.api.Dlc.Id dlcs     = 2;
    repeated ProvisionState.Package      packages = 3;

    // Variant on the primary build target to test with.
    //   Eg: If we were targeting a 'coral' board for testing, setting this
    //   to 'kernelnext' woul duse the coral-kernelnext image from the build for
    //   testing.
    string board_variant = 4;

    // Optional tarball to pass through to provisioning.
    StoragePath overwrite_payload = 5;
}
